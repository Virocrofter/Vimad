# ──────────────────────────────────────────────────────────────────────────────
# Vimad PMS — Development Compose
# Usage: docker compose up -d
# Secrets: via .env file (never commit .env to git)
# ──────────────────────────────────────────────────────────────────────────────

name: vimad-dev

services:
  # ─── API (Express + Prisma) ───
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: deps
    command: sh -c "npx prisma migrate deploy && npm run db:seed && npm run dev --workspace=apps/api"
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://vimad:${POSTGRES_PASSWORD:-vimad_dev_password}@postgres:5432/vimad?schema=public
      REDIS_URL: redis://redis:6379
      WEB_URL: http://localhost:5173
      API_PUBLIC_URL: http://localhost:3001
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/shared:/app/packages/shared
      - api_node_modules:/app/node_modules
      - api_storage:/app/apps/api/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - vimad

  # ─── Web (Vite Dev Server) ───
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev --workspace=apps/web"
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:3001
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - vimad

  # ─── PostgreSQL 16 ───
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vimad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vimad_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-vimad}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-vimad} -d $${POSTGRES_DB:-vimad}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - vimad

  # ─── Redis 7 (BullMQ + Rate Limiting + Cache) ───
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - vimad

  # ─── MailHog (Dev email catcher) ───
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    restart: unless-stopped
    networks:
      - vimad

# ─── Named Volumes ───
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  api_storage:
    driver: local
  api_node_modules:
    driver: local
  web_node_modules:
    driver: local

# ─── Networks ───
networks:
  vimad:
    driver: bridge